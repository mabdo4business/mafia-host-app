<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mafia Host — Day vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120D0B}
a{color:#F3CD78}a:hover{color:#FFE0A0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #120D0B; color: #FBF4EA; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; top: -180px; right: -140px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,112,0.16) 0%, rgba(255,200,112,0) 70%)"></div>

  <div style="padding: 54px 24px 0 24px; display: flex; justify-content: space-between; align-items: center; position: relative">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #FFD9A0; font-weight: 600">Day 3</div>
      <div style="font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700">Who is lying?</div>
    </div>
    <div style="position: relative; width: 76px; height: 76px">
      <svg aria-hidden="true" width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="33" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"></circle><circle cx="38" cy="38" r="33" fill="none" stroke="#FFC870" stroke-width="6" stroke-linecap="round" stroke-dasharray="207" stroke-dashoffset="62" transform="rotate(-90 38 38)"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 700">1:42</div>
        <div style="font-size: 10.5px; color: #CDBFAE">left</div>
      </div>
    </div>
  </div>

  <div style="margin: 22px 24px 0 24px; padding: 4px; border-radius: 16px; background: rgba(255,255,255,0.06); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; position: relative">
    <button style="height: 42px; border-radius: 12px; border: none; background: transparent; color: #CDBFAE; font-size: 14px; font-weight: 500">Discussion</button>
    <button style="height: 42px; border-radius: 12px; border: none; background: #FBF4EA; color: #1A100A; font-size: 14px; font-weight: 600">Voting</button>
  </div>

  <div style="margin: 18px 24px 0 24px; display: flex; justify-content: space-between; font-size: 13px; color: #CDBFAE; position: relative">
    <div>Tap a player to add a vote</div>
    <div><b style="color: #FBF4EA">6</b> of 6 voted</div>
  </div>

  <div style="margin: 12px 24px 0 24px; display: flex; flex-direction: column; gap: 8px; position: relative">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button style="height: 64px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; border: {{r.border}}; background: rgba(255,255,255,0.04); color: #FBF4EA; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; text-align: start">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{r.width}}; background: {{r.fill}}"></div>
        <div style="width: 36px; height: 36px; border-radius: 18px; background: {{r.avatarBg}}; color: {{r.avatarColor}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; position: relative">{{r.initials}}</div>
        <div style="font-size: 15px; font-weight: 600; flex-grow: 1; position: relative">{{r.name}}</div>
        <div style="font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 700; color: {{r.countColor}}; position: relative">{{r.votes}}</div>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 0 24px 34px 24px; display: flex; flex-direction: column; gap: 10px; position: relative">
    <a href="Night.dc.html" style="height: 60px; border-radius: 20px; background: #E5484D; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; box-shadow: 0 10px 30px rgba(229,72,77,0.35)">Eliminate Omar</a>
    <button style="height: 44px; border: none; background: transparent; color: #CDBFAE; font-size: 14px; font-weight: 500">Undo last vote</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [['Omar', 'OM', 3], ['Sara', 'SA', 2], ['Noor', 'NO', 1], ['Layla', 'LA', 0], ['Mariam', 'MA', 0], ['Hamad', 'HA', 0]];
    var rows = data.map((d, i) => {
      var lead = i === 0;
      return {
        name: d[0], initials: d[1], votes: d[2],
        width: Math.round(d[2] / 6 * 100) + '%',
        fill: lead ? 'rgba(229,72,77,0.22)' : 'rgba(255,200,112,0.12)',
        border: lead ? '1.5px solid rgba(229,72,77,0.6)' : '1px solid rgba(255,255,255,0.08)',
        avatarBg: lead ? '#E5484D' : '#2E2420',
        avatarColor: lead ? '#FFFFFF' : '#E6DCCF',
        countColor: lead ? '#FF8A8E' : (d[2] > 0 ? '#FFD9A0' : '#8F8478')
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
