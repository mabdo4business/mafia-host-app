<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mafia Host — Game setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080C}
a{color:#E8B54A}a:hover{color:#F3CD78}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07080C; color: #F2EEE6; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="padding: 56px 24px 0 24px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04); color: #F2EEE6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700">New game</div>
  </div>

  <div style="margin: 24px 24px 0 24px; padding: 18px; border-radius: 24px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; color: #9AA0AE">Players at the table</div>
        <div style="font-family: Unbounded, sans-serif; font-size: 34px; font-weight: 700">11</div>
      </div>
      <div style="display: flex; gap: 8px">
        <button aria-label="Fewer players" style="width: 48px; height: 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #F2EEE6; font-size: 22px">−</button>
        <button aria-label="More players" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: #F2EEE6; color: #0B0C10; font-size: 22px">+</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 3px">
        <div style="flex-grow: 3; background: #E5484D; border-radius: 5px"></div>
        <div style="flex-grow: 8; background: #E8B54A; border-radius: 5px"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px">
        <div style="color: #FF8A8E; font-weight: 600">Mafia 3</div>
        <div style="color: #9AA0AE">Balanced for 11</div>
        <div style="color: #F3CD78; font-weight: 600">Civilians 8</div>
      </div>
    </div>
  </div>

  <div style="margin: 24px 24px 0 24px; display: flex; justify-content: space-between; align-items: baseline">
    <div style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 500">Roles</div>
    <a href="#" style="font-size: 13px; text-decoration: none">Auto-balance</a>
  </div>

  <div style="margin: 12px 24px 0 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="10">
      <div style="height: 64px; box-sizing: border-box; padding: 0 12px; border-radius: 18px; background: {{r.bg}}; border: 1px solid {{r.border}}; display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; border-radius: 12px; background: {{r.iconBg}}; color: {{r.color}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; flex-grow: 1">{{r.name}}</div>
        <div style="min-width: 28px; height: 28px; border-radius: 10px; background: {{r.countBg}}; color: {{r.countColor}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{r.count}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin: 16px 24px 0 24px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; font-weight: 600">Bomb takes down</div>
      <div style="font-size: 12px; color: #9AA0AE">Players chosen when he dies</div>
    </div>
    <div style="padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; gap: 4px">
      <button style="width: 44px; height: 36px; border-radius: 10px; border: none; background: transparent; color: #B7BBC6; font-size: 14px; font-weight: 600">2</button>
      <button style="width: 44px; height: 36px; border-radius: 10px; border: none; background: #F2EEE6; color: #0B0C10; font-size: 14px; font-weight: 700">3</button>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 24px 34px 24px">
    <a href="Reveal.dc.html" style="height: 60px; border-radius: 20px; background: #E5484D; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 30px rgba(229,72,77,0.35)">
      Shuffle &amp; deal roles
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var mafia = { bg: 'rgba(229,72,77,0.07)', border: 'rgba(229,72,77,0.22)', iconBg: 'rgba(229,72,77,0.18)', color: '#FF8A8E', countBg: '#E5484D', countColor: '#FFFFFF' };
    var civ = { bg: 'rgba(255,255,255,0.04)', border: 'rgba(255,255,255,0.08)', iconBg: 'rgba(232,181,74,0.16)', color: '#F3CD78', countBg: 'rgba(232,181,74,0.18)', countColor: '#F3CD78' };
    var off = { bg: 'rgba(255,255,255,0.02)', border: 'rgba(255,255,255,0.05)', iconBg: 'rgba(255,255,255,0.05)', color: '#6E7484', countBg: 'rgba(255,255,255,0.06)', countColor: '#8A90A0' };
    var roles = [
      Object.assign({ name: 'Godfather', count: 1, icon: 'M3 16h18M6 16l1.5-8h9L18 16M8 12h8' }, mafia),
      Object.assign({ name: 'Potana', count: 1, icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM5.6 5.6l12.8 12.8' }, mafia),
      Object.assign({ name: 'Lawyer', count: 1, icon: 'M12 3v18M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0zM8 21h8' }, mafia),
      Object.assign({ name: 'Mafia', count: 0, icon: 'M14 4l6 6-9 9-4 1 1-4z' }, off),
      Object.assign({ name: 'Doctor', count: 1, icon: 'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z' }, civ),
      Object.assign({ name: 'Detective', count: 1, icon: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5' }, civ),
      Object.assign({ name: 'Bomb', count: 1, icon: 'M11 8a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM15 6l2-2M19 3v1M21 6h-1' }, civ),
      Object.assign({ name: 'Joker', count: 1, icon: 'M4 5h16v6a8 8 0 0 1-16 0zM8 14c1.5 1.5 6.5 1.5 8 0M8.5 9h.01M15.5 9h.01' }, civ),
      Object.assign({ name: 'Chameleon', count: 1, icon: 'M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2M20 4v4h-4M4 20v-4h4' }, civ),
      Object.assign({ name: 'Civilian', count: 3, icon: 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21a8 8 0 0 1 16 0' }, civ)
    ];
    return { roles: roles };
  }
}
</script>
</body>
</html>
